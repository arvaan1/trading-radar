name: Update Smart Money Feed scan

on:
  schedule:
    # 12:30 UTC = 6:00 PM IST - bulk/block/short-sell disclosures are
    # typically available from NSE within an hour or two of the 3:30 PM close.
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: smart-money

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: smart-money/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scripts/scan.py

      - name: Commit updated data
        run: |
          git config user.name "smart-money-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan_results.json data/deals_cache.csv data/short_sell_cache.csv
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Smart money feed update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
