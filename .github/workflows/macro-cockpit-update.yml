name: Update Macro Cockpit scan

on:
  # No native schedule trigger on this workflow anymore. It used to have
  # one, running alongside an external cron-job.org trigger as "extra
  # insurance" - but the two were never coordinated, and on DMA Radar
  # specifically they landed only ~4 minutes apart while a run takes
  # 11-13 minutes, causing near-certain overlap and the exact git-push
  # conflict debugged earlier. The external trigger has since proven
  # itself reliable on its own, so this is removed rather than kept as
  # redundant, overlap-prone dead weight. Triggered exclusively via
  # cron-job.org calling workflow_dispatch below (or manually).
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: macro-cockpit

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: macro-cockpit/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scripts/scan.py

      - name: Commit updated data
        run: |
          git config user.name "macro-cockpit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan_results.json data/macro_history.csv data/participant_oi_cache.csv
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Macro cockpit update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Syncs with the latest remote state right before pushing, not
          # just at the start of the run. Without this, a long-running scan
          # (10+ minutes for a full watchlist) can finish with a save point
          # that is no longer the latest one, if anything else was committed
          # to the repo while it was running - git then rejects the push
          # outright rather than risk overwriting that other work. Rebasing
          # onto the latest remote commit first closes that gap.
          git pull --rebase --autostash origin main
          git push
