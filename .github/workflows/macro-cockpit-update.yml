name: Update Macro Cockpit scan

on:
  schedule:
    - cron: "48 12 * * 1-5"   # ~6:18 PM IST - after cash close, comfortably after VIX/breadth publish
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: macro-cockpit

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: macro-cockpit/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scripts/scan.py

      - name: Commit updated data
        run: |
          git config user.name "macro-cockpit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan_results.json data/macro_history.csv data/participant_oi_cache.csv
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Macro cockpit update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
