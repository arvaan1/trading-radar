name: Update Re-Rating Radar scan

on:
  # No native schedule - same reasoning as the other four workflows,
  # triggered via cron-job.org calling workflow_dispatch, or manually.
  # This one should run AFTER DMA Radar, Delivery Radar, and Smart Money
  # Feed each evening, since it reads all three of their outputs - set
  # its cron-job.org trigger time a little later than those three.
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: re-rating-radar

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: re-rating-radar/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scripts/scan.py

      - name: Commit updated data
        run: |
          git config user.name "re-rating-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan_results.json data/compression_history.csv
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Re-rating radar update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin main
          git push
