name: Update Delivery Radar scan

on:
  schedule:
    - cron: "5 11 * * 1-5"   # staggered 5 min after the DMA radar's run
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: delivery-radar

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: delivery-radar/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scripts/scan.py --sleep 0.6

      - name: Commit updated data
        run: |
          git config user.name "delivery-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan_results.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Delivery radar scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
