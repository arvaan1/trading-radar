name: Update Delivery Radar scan

on:
  schedule:
    # 15:15 UTC = 8:45 PM IST. Pushed later than before: the bhavcopy file
    # this version relies on is typically published closer to 8 PM IST,
    # not immediately after the 3:30 PM close. If it's not ready yet on a
    # given day, the scan just picks it up automatically on the next run -
    # nothing breaks, but a later schedule means fresher same-day data.
    - cron: "6 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: delivery-radar

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: delivery-radar/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scripts/scan.py --sleep 0.5

      - name: Commit updated data
        run: |
          git config user.name "delivery-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan_results.json data/bhavcopy_cache.csv
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Delivery radar scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
