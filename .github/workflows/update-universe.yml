name: Update Universe (Nifty 500 + Microcap 250)

on:
  workflow_dispatch: {}
  # Intentionally NO schedule - NSE index membership changes a few times a
  # year, not daily. Run this manually (Actions tab -> Run workflow)
  # whenever you want to refresh, or after editing universe_extras.txt.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Build universe
        run: python build_universe.py

      - name: Commit updated watchlists
        run: |
          git config user.name "universe-builder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dma-radar/watchlist.txt delivery-radar/watchlist.txt
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Refresh universe from NSE indices: $(date -u +'%Y-%m-%d')"
          git push
